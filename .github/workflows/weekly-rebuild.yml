# Rebuilds and redeploys every Monday so newly approved profiles appear and the
# Supabase free project never idles for 7 days. Needs repository secrets
# CLOUDFARE_API_TOKEN (template "Edit Cloudflare Workers") and CLOUDFARE_ACCOUNT_ID.
# The secret names are spelled without the L on purpose: that is how they were
# created in the repository settings. Rename both places together if you fix it.
name: Weekly rebuild
on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFARE_ACCOUNT_ID }}
